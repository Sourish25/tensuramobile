<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>Tensura: Path of the Reincarnated</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --bg: #0a0e14; --pane: #0d1420; --edge: #1d2b3f;
    --gold: #ffd75e; --fg: #cfe3ff;
    font-size: clamp(8px, 2.2vw, 17px);
  }
  @media (orientation: landscape) { :root { font-size: clamp(8px, 1.7vw, 16px); } }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; background:var(--bg); color:var(--fg);
    font-family:"Cascadia Mono","JetBrains Mono",Consolas,"Courier New",monospace; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  header { padding: calc(env(safe-area-inset-top) + 8px) 12px 8px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--edge); background:var(--pane); flex:0 0 auto; }
  header .t { color:var(--gold); font-weight:700; letter-spacing:.15em; font-size:.85rem; }
  header .s { font-size:.65rem; opacity:.55; letter-spacing:.08em; }
  main { flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    padding:10px 10px 12px; }
  @media (orientation:landscape) and (min-width:760px){ main{ max-width:112ch; margin:0 auto; width:100%; } }
  #dock { flex:0 0 auto; border-top:1px solid var(--edge); background:var(--pane);
    padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);
    display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow-y:auto; }
  .rpgpanel { background:#16283e; border:2px solid #3f6fa8; border-radius:8px;
    padding:8px 10px; font-family:"Press Start 2P","Cascadia Mono",Consolas,monospace;
    font-size:.68rem; line-height:1.7; box-shadow:0 2px 0 rgba(0,0,0,.4); }
  .rpgpanel .ttl { color:#8fd3ff; text-align:center; margin-bottom:5px; }
  .rpgbtn { display:block; width:100%; text-align:center; background:#1d3a5f;
    color:#eaf4ff; border:1px solid #3f6fa8; border-radius:6px; padding:11px 8px;
    margin:5px 0; font:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .rpgbtn:active { background:#2c5688; }
  .rpgbtn.cancel { background:#3a1d1d; border-color:#a83f3f; color:#ffd9d9; }
  .bar { height:13px; background:#0a1524; border:1px solid #3f6fa8; border-radius:3px;
    overflow:hidden; position:relative; margin:3px 0; }
  .bar > i { display:block; height:100%; background:#e04848; }
  .bar.mp > i { background:#37c8e8; }
  .bar span { position:absolute; inset:0; text-align:center; font-size:.55rem;
    line-height:13px; color:#fff; text-shadow:1px 1px 0 #000; }
  .ecard { display:flex; align-items:center; gap:9px; background:#101c2c;
    border:1px solid #3f6fa8; border-radius:6px; padding:7px 9px; margin:5px 0; }
  .ecard .g { font-size:1.55rem; filter:drop-shadow(0 0 4px rgba(0,0,0,.6)); }
  .ecard .n { flex:1; min-width:0; }
  .ecard .nm { color:#fff; margin-bottom:2px; }
  .ecard .st { color:#ffd75e; font-size:.52rem; margin-top:2px; }
  .ecard.dead { opacity:.35; }
  .ecard.boss { border-color:#ffd75e; }
  pre.term { font-family:inherit; font-size:1rem; line-height:1.38;
    white-space:pre-wrap; word-break:break-word; text-shadow:0 0 6px rgba(120,180,255,.12); }
  #loading { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; background:var(--bg); z-index:9; transition:opacity .5s; }
  #loading h1 { color:var(--gold); font-size:1.15rem; letter-spacing:.25em; }
  #loading p { opacity:.6; font-size:.75rem; max-width:30ch; text-align:center; line-height:1.5; }
  .spin { width:36px; height:36px; border-radius:50%;
    border:3px solid var(--edge); border-top-color:var(--gold); animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .inpline { display:flex; align-items:baseline; }
  .inpline .ps1 { color:var(--gold); font-weight:700; white-space:pre; }
  .inpline input { flex:1; min-width:0; background:transparent; border:0; outline:0;
    color:var(--fg); font:inherit; line-height:inherit; caret-color:var(--gold); padding:0; }
</style>
</head>
<body>
  <header><div class="t">TENSURA</div><div class="s" id="ver">v1.1.1</div></header>
<main><pre class="term" id="term"></pre></main>
<div id="dock"><div id="hud"></div><div id="ctl"></div></div>
<div id="loading">
  <h1>TENSURA</h1>
  <div class="spin"></div>
  <p id="loadmsg">summoning python into your browser...</p>
  <pre id="errdetail" style="max-width:90vw; max-height:30vh; overflow:auto; font-size:.62rem; opacity:.75; white-space:pre-wrap;"></pre>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
const APP_VERSION = "v1.1.1";
document.title = `Tensura ${APP_VERSION}`;

const term = document.getElementById("term");
function esc(s){ return s.replace(/\x1b/g, "").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

function ansiToHtml(s){
  const parts = s.split("\x1b[");
  let out = esc(parts.shift());
  const stack = [];
  const map = {"1":"font-weight:bold","3":"font-style:italic","2":"opacity:.55",
    "31":"#ff6b6b","32":"#69db7c","33":"#ffd75e","34":"#74c0fc",
    "35":"#e599f7","36":"#66d9e8","37":"#cfe3ff",
    "91":"#ff8787","92":"#8ce99a","93":"#ffe066","94":"#a5d8ff",
    "95":"#eebefa","96":"#99e9f2","97":"#ffffff"};
  for (const part of parts){
    const m = part.match(/^([0-9;]*)m/);
    if (!m){ out += esc(part); continue; }
    const rest = part.slice(m[0].length);
    for (const code of m[1].split(";").filter(x=>x!=="")){
      if (code === "0") stack.length = 0; else stack.push(code);
    }
    if (stack.length === 0){ out += esc(rest); continue; }
    const style = stack.map(c=>map[c] ? `color:${map[c]}` : "")
                       .filter(Boolean).join(";");
    out += style ? `<span style="${style}">${esc(rest)}</span>` : esc(rest);
  }
  return out + "\n";
}

const ctl = document.getElementById("ctl");
const hud = document.getElementById("hud");

function scrollBottom(){
  const m = document.querySelector("main");
  m.scrollTop = m.scrollHeight;
}

function echo(s){
  term.insertAdjacentHTML("beforeend", ansiToHtml(s));
  scrollBottom();
}

function setCtl(el){ ctl.replaceChildren(el); return el; }
function clearCtl(){ ctl.replaceChildren(); }

window.tensuraPush = function(chunk){
  if (!chunk) return;
  hideLoading();
  if (chunk.includes("\x1b[2J")){
    term.innerHTML = "";
    chunk = chunk.replace(/\x1b\[2J/g, "").replace(/\x1b\[H/g, "");
  }
  if (chunk) term.insertAdjacentHTML("beforeend", ansiToHtml(chunk));
  scrollBottom();
};

window.tensuraPrompt = function(text){
  return new Promise((resolve)=>{
    const cleaned = (text == null ? "" : String(text)).replace(/\x1b\[[0-9;]*m/g, "");
    const wrap = document.createElement("div");
    wrap.className = "inpline";
    const ps = document.createElement("span");
    ps.className = "ps1";
    ps.textContent = "> ";
    const inp = document.createElement("input");
    inp.setAttribute("autocapitalize", "off");
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("spellcheck", "false");
    inp.setAttribute("autocorrect", "off");
    wrap.appendChild(ps);
    wrap.appendChild(inp);
    wrap.addEventListener("click", ()=>inp.focus());
    setCtl(wrap);
    if (cleaned.trim()) echo(cleaned + "\n");
    inp.addEventListener("keydown", function h(e){
      if (e.key !== "Enter") return;
      e.preventDefault();
      inp.removeEventListener("keydown", h);
      const v = inp.value;
      echo("> " + v + "\n");
      clearCtl();
      resolve(v);
    });
    inp.focus();
    scrollBottom();
  });
};

window.tensuraMenu = function(prompt, options, allowCancel, cancelLabel){
  return new Promise((resolve)=>{
    const panel = document.createElement("div");
    panel.className = "rpgpanel";
    if (prompt && String(prompt).trim()){
      const t = document.createElement("div");
      t.className = "ttl";
      t.textContent = String(prompt);
      panel.appendChild(t);
    }
    function fin(n, label){
      echo("> " + label + "\n");
      clearCtl();
      resolve(String(n));
    }
    const opts = Array.from(options == null ? [] : options);
    opts.forEach((opt, i)=>{
      const b = document.createElement("button");
      b.className = "rpgbtn";
      b.textContent = (i + 1) + ". " + String(opt);
      b.addEventListener("click", ()=>fin(i + 1, String(opt)));
      panel.appendChild(b);
    });
    if (allowCancel){
      const b = document.createElement("button");
      b.className = "rpgbtn cancel";
      b.textContent = "0. " + String(cancelLabel || "Back");
      b.addEventListener("click", ()=>fin(0, String(cancelLabel || "Back")));
      panel.appendChild(b);
    }
    setCtl(panel);
    scrollBottom();
  });
};

window.tensuraPause = function(label){
  return new Promise((resolve)=>{
    const b = document.createElement("button");
    b.className = "rpgbtn";
    b.textContent = "\u25b8 " + String(label || "Continue");
    b.addEventListener("click", ()=>{ clearCtl(); resolve(""); });
    setCtl(b);
    scrollBottom();
  });
};

const ENEMY_ART = [["rat","🐀"],["bat","🦇"],["wolf","🐺"],["spider","🕷"],["slime","🟢"],
  ["goblin","👺"],["hobgoblin","👺"],["orc","👹"],["ogre","👹"],["kobold","🦎"],
  ["skeleton","💀"],["zombie","🧟"],["ghost","👻"],["wraith","👻"],["vampire","🧛"],
  ["troll","🧌"],["demon","😈"],["dragon","🐉"],["drake","🐉"],["wyrm","🐉"],
  ["snake","🐍"],["serpent","🐍"],["bear","🐻"],["boar","🐗"],["bee","🐝"],["wasp","🐝"],
  ["mushroom","🍄"],["golem","🗿"],["crab","🦀"],["fish","🐟"],["imp","👺"],
  ["centipede","🐛"],["beetle","🪲"],["scorpion","🦂"],["ape","🦍"],["tiger","🐅"],
  ["lion","🦁"],["eagle","🦅"],["hawk","🦅"],["owl","🦉"],["frog","🐸"],["toad","🐸"]];
function artFor(name){
  const n = String(name).toLowerCase();
  for (const [k, v] of ENEMY_ART){ if (n.includes(k)) return v; }
  return "👹";
}
function barHtml(cur, mx, cls){
  const pct = Math.max(0, Math.min(100, Math.round(cur / Math.max(1, mx) * 100)));
  return `<div class="bar ${cls || ""}"><i style="width:${pct}%"></i><span>${cur}/${mx}</span></div>`;
}
let hudTimer = null;
window.tensuraBattle = function(json){
  let d;
  try { d = JSON.parse(json); } catch(e){ return; }
  if (hudTimer){ clearTimeout(hudTimer); hudTimer = null; }
  if (d.final){
    hudTimer = setTimeout(()=>{ hud.replaceChildren(); }, 1600);
    return;
  }
  hud.replaceChildren();
  const ep = document.createElement("div");
  ep.className = "rpgpanel";
  const t = document.createElement("div");
  t.className = "ttl";
  t.textContent = (d.location || "Battle") + (d.round ? " - Round " + d.round : "");
  ep.appendChild(t);
  (d.foes || []).forEach((f)=>{
    const c = document.createElement("div");
    c.className = "ecard" + (f.alive ? "" : " dead") + (f.boss ? " boss" : "");
    const g = document.createElement("div");
    g.className = "g";
    g.textContent = artFor(f.name);
    const n = document.createElement("div");
    n.className = "n";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = (f.boss ? "👑 " : "") + f.name + (f.alive ? "" : " (slain)");
    n.appendChild(nm);
    n.insertAdjacentHTML("beforeend", barHtml(f.hp, f.max_hp, ""));
    if (f.status){
      const s = document.createElement("div");
      s.className = "st";
      s.textContent = f.status;
      n.appendChild(s);
    }
    c.appendChild(g);
    c.appendChild(n);
    ep.appendChild(c);
  });
  hud.appendChild(ep);
  (d.party || []).forEach((p)=>{
    const c = document.createElement("div");
    c.className = "ecard" + (p.alive ? "" : " dead");
    const n = document.createElement("div");
    n.className = "n";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = (p.hero ? "🗡️ " : "") + p.name;
    n.appendChild(nm);
    n.insertAdjacentHTML("beforeend", barHtml(p.hp, p.max_hp, ""));
    n.insertAdjacentHTML("beforeend", barHtml(p.mp, p.max_mp, "mp"));
    c.appendChild(n);
    hud.appendChild(c);
  });
  scrollBottom();
};

function hideLoading(){
  const l = document.getElementById("loading");
  if (l){ l.style.opacity = "0"; setTimeout(()=>l.remove(), 300); }
}

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = src;
    s.onload = resolve;
    s.onerror = ()=>reject(new Error("could not load " + src));
    document.head.appendChild(s);
  });
}

function withTimeout(promise, ms, label){
  let t;
  const guard = new Promise((_, rej)=>{ t = setTimeout(()=>rej(new Error(label + " timed out")), ms); });
  return Promise.race([promise, guard]).finally(()=>clearTimeout(t));
}

async function attemptMirror(base, setMsg){
  await warmCache(base, setMsg);
  await loadScript(base + "pyodide.js");
  if (typeof loadPyodide !== "function") throw new Error("loader missing");
  return await loadPyodide({ indexURL: base });
}

async function loadPyodideWithFallback(setMsg){
  const sources = [
    "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/",
    "https://unpkg.com/pyodide@0.26.2/",
    "https://cdn.jsdelivr.net/npm/pyodide@0.26.2/"
  ];
  let lastErr = null;
  for (let i=0;i<sources.length;i++){
    const base = sources[i];
    const host = new URL(base).host;
    try {
      setMsg(`python runtime ${i+1}/${sources.length} via ${host}`);
      return await withTimeout(attemptMirror(base, setMsg), 300000, host);
    } catch(e){
      lastErr = e;
      setMsg(`${host}: ${e && e.message ? e.message : e} - trying another mirror...`);
    }
  }
  throw new Error("could not download the python runtime - check your internet connection" +
    (lastErr ? ` [${lastErr && lastErr.message ? lastErr.message : lastErr}]` : ""));
}

async function warmCache(base, setMsg){
  const files = ["pyodide.asm.wasm", "python_stdlib.zip"];
  for (const f of files){
    try {
      const resp = await fetch(base + f);
      if (!resp.ok) return;
      const total = Number(resp.headers.get("content-length") || 0);
      if (!resp.body || !resp.body.getReader) return;
      const reader = resp.body.getReader();
      let got = 0;
      while (true){
        const {done, value} = await reader.read();
        if (done) break;
        got += value.length;
        const mb = (got/1048576).toFixed(1);
        const pct = total ? ` (${Math.round(got/total*100)}%)` : "";
        setMsg(`first-time download ${mb} MB${pct} - one time only, stays cached`);
      }
    } catch(e){ return; }
  }
}

async function boot(){
  const msg = document.getElementById("loadmsg");
  const ver = document.getElementById("ver");
  if (ver) ver.textContent = APP_VERSION;
  try {
    pyodide = await loadPyodideWithFallback(t=>msg.textContent=t);
    msg.textContent = "inscribing world language...";
    pyodide.FS.mkdirTree("/game");
    await pyodide.runPythonAsync(`import sys, os
sys.path.insert(0, "/game")
os.chdir("/game")`);
    const files = await fetch(`files.json?v=${APP_VERSION}`).then(r=>{
      if (!r.ok) throw new Error("files.json missing");
      return r.json();
    });
    let done = 0;
    for (const f of files){
      const resp = await fetch(`game/${f}?v=${APP_VERSION}`);
      if (!resp.ok) throw new Error("missing " + f);
      const buf = new Uint8Array(await resp.arrayBuffer());
      const dir = ("/game/" + f).split("/").slice(0,-1).join("/");
      try { pyodide.FS.mkdirTree(dir); } catch(e){}
      pyodide.FS.writeFile("/game/" + f, buf);
      done++;
    }
    msg.textContent = "reincarnating...";
    hideLoading();
    await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, "/game")
import game_web
await game_web.boot()
`);
  } catch (err){
    const text = "BOOT ERROR: " + (err && err.message ? err.message : err) +
      "\n" + ((err && err.stack) ? String(err.stack).slice(0, 900) : "");
    const l = document.getElementById("loading");
    if (l){
      msg.textContent = "failed to wake the dragon: " + (err && err.message ? err.message : err);
      const pre = document.getElementById("errdetail");
      if (pre) pre.textContent = (err && err.stack) ? String(err.stack).slice(0, 900) : "";
    } else {
      window.tensuraPush("\n" + text + "\n");
    }
  }
}
boot();
</script>
</body>
</html>
